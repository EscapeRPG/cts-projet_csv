# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    voiture_upload_root: '%env(resolve:VOITURES_UPLOAD_ROOT)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $mailerFromAddress: '%env(string:MAILER_FROM_ADDRESS)%'
            string $mailerFromName: '%env(string:MAILER_FROM_NAME)%'
            string $supportToAddress: '%env(string:SUPPORT_TO_ADDRESS)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        autowire: true
        autoconfigure: true

    App\Import\Service\ImportRouter:
        arguments:
            $clientsImport: '@App\Import\Service\ImportClientsService'
            $centresClientsImport: '@App\Import\Service\ImportCentresClientsService'
            $clientsControlesImport: '@App\Import\Service\ImportClientsControlesService'
            $controlesImport: '@App\Import\Service\ImportControlesService'
            $controlesFacturesImport: '@App\Import\Service\ImportControlesFacturesService'
            $controlesNonFacturesImport: '@App\Import\Service\ImportControlesNonFacturesService'
            $facturesImport: '@App\Import\Service\ImportFacturesService'
            $facturesReglementsImport: '@App\Import\Service\ImportFacturesReglementsService'
            $reglementsImport: '@App\Import\Service\ImportReglementsService'
            $prestasNonFactureesImport: '@App\Import\Service\ImportPrestasNonFactureesService'

    App\Import\Sftp\SftpClient:
        arguments:
            $mode: '%env(string:SFTP_MODE)%'
            $basePath: '%env(string:SFTP_LOCAL_PATH)%'

    App\Shared\Twig\AppExtension:
        tags: ['twig.extension']

    App\ParcAutomobile\Service\VoitureCertificatCessionStorage:
        arguments:
            $voitureUploadRoot: '%voiture_upload_root%'
